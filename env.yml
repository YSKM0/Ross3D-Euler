name: ross3d
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  # PyTorch + CUDA 12.1 from conda (matches your cuda/12.1.1 module well)
  - pytorch
  - torchvision
  - pytorch-cuda=12.1
  # optional build tools (keep if you need to compile some extras)
  - cmake
  - gcc_linux-64
  - gxx_linux-64
  # (DON'T add cuda-* or nvidia-* runtime libs here; pytorch-cuda brings what it needs)
  - pip:
      # keep your pip list BUT **remove** these (they now come from conda):
      # torch, torchvision, triton, all nvidia-cu12* runtime wheels
      # keep flash-attn here; with torch preinstalled it will work
